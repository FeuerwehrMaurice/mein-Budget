<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>MONETA – Mein Geld</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MONETA"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172238;background:#f6f7fb;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:650px;margin:auto;padding:20px 17px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 23px}.brand{font-size:27px;font-weight:850;letter-spacing:-1.2px}.brand span{color:#2478ee}.sub{font-size:12px;color:#78849a}.pill{background:white;border:1px solid #e7eaf0;border-radius:22px;padding:9px 12px;color:#51627a}.hero{background:linear-gradient(135deg,#1f67dc,#508efa);border-radius:25px;color:white;padding:24px;box-shadow:0 12px 28px #2d72e52b}.hero .muted{color:#dbe8ff}.big{font-size:37px;font-weight:780;letter-spacing:-1.4px;margin:7px 0 17px}.herogrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;border-top:1px solid #ffffff4d;padding-top:16px}.herogrid b{display:block;font-size:20px;margin-top:5px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 1px 12px}.section h2{font-size:18px;letter-spacing:-.4px;margin:0}.card{background:white;border:1px solid #e9edf4;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 3px 12px #22305006}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.label{color:#748095;font-size:12px}.value{font-size:23px;font-weight:760;margin-top:7px}.red{color:#df4d58}.green{color:#12875d}.blue{color:#2679e8}.small{font-size:12px;color:#738096}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:8px;background:#edf1f7;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#4088ef;border-radius:9px}.item{padding:13px 0;border-bottom:1px solid #eff1f6}.item:last-child{border-bottom:0}.iconbox{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:#edf4ff;font-size:20px}.itemleft{display:flex;align-items:center;gap:11px;min-width:0}.itemtitle{font-weight:650}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid #e8ebf2;display:flex;justify-content:space-around;padding:11px 4px calc(11px + env(safe-area-inset-bottom))}.tabs button{background:transparent;color:#7c8798;font-size:11px;min-width:56px}.tabs button.active{color:#287bea;font-weight:750}.tabs .ico{display:block;font-size:22px;margin-bottom:3px}.primary{background:#287bea;color:white;border-radius:14px;padding:13px 18px;font-weight:700}.secondary{background:#edf3fc;color:#2469c7;border-radius:12px;padding:11px 14px;font-weight:650}.danger{background:#fff0f1;color:#c83d4b;border-radius:12px;padding:9px 12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.fab{position:fixed;right:max(18px,calc((100vw - 610px)/2));bottom:87px;background:#267aeb;color:white;width:56px;height:56px;border-radius:19px;font-size:31px;box-shadow:0 8px 22px #2275e65e;z-index:3}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#111d3199;display:flex;align-items:flex-end;justify-content:center;z-index:10}.modal{width:100%;max-width:650px;max-height:92dvh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 19px calc(23px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 18px}label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,select{width:100%;border:1px solid #dce2ec;border-radius:12px;padding:13px;background:white;color:#172238;outline-color:#287bea}input[type=file]{font-size:12px}input[type=checkbox]{width:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{background:#f0f6ff;border-radius:13px;padding:12px;color:#53647c;font-size:12px;line-height:1.5}.empty{color:#8b95a6;text-align:center;padding:24px}.rowbtn{background:none;color:#2476df;font-weight:650;padding:4px}.error{color:#c83d4b}.muted{color:#718097} .right{text-align:right} .heading{font-size:22px;font-weight:800;margin:10px 0 16px} .mini{font-size:11px}.full{width:100%} .nowrap{white-space:nowrap} .chip{display:inline-block;background:#eaf3ff;color:#2672d5;padding:5px 9px;border-radius:10px;font-size:11px} @media(min-width:650px){.tabs{left:calc(50% - 325px);right:calc(50% - 325px)}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">MON<span>ETA</span></div><div class="sub">Version 4 · Bank & Bargeld.</div></div><button class="pill" onclick="openSettings()">⚙️ Einstellungen</button></header><div id="content"></div></main><button class="fab" id="fab" onclick="openTransaction()" aria-label="Buchung hinzufügen">+</button><nav class="tabs" id="tabs"></nav><div class="overlay hidden" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script>
'use strict';
const KEY='moneta-v2-data';const EUR=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});const fmt=n=>EUR.format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>localDate(new Date());function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function plusMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1,12)}function lastBankday(y,m){let d=new Date(y,m+1,0,12);while([0,6].includes(d.getDay()))d.setDate(d.getDate()-1);return d}function payday(d){let p=lastBankday(d.getFullYear(),d.getMonth());if(localDate(d)>=localDate(p))return p;return lastBankday(d.getFullYear(),d.getMonth()-1)}function nextPayday(d){let p=lastBankday(d.getFullYear(),d.getMonth());if(localDate(d)<localDate(p))return p;return lastBankday(d.getFullYear(),d.getMonth()+1)}function cycle(){let now=new Date(),start=payday(now),end=nextPayday(now);return {start:localDate(start),end:localDate(end),days:Math.max(1,Math.ceil((end-now)/86400000))}}const cats=[['Lebensmittel','🛒'],['Freizeit','🎉'],['Shopping','🛍️'],['Mobilität','🚗'],['Essen & Trinken','☕'],['Gesundheit','💊'],['Sonstiges','📦']];const iconFor=c=>(cats.find(x=>x[0]===c)||['','💳'])[1];const blank=()=>({version:4,balance:0,balanceAsOf:today(),cash:0,cashAsOf:today(),income:[],fixed:[],budgets:cats.map(x=>({name:x[0],limit:0})),transactions:[],buffer:0});let state;try{state=JSON.parse(localStorage.getItem(KEY))||blank();if(![2,3,4].includes(state.version))throw Error('version');state.version=4;state.cash=Number(state.cash)||0;state.cashAsOf=state.cashAsOf||today();}catch(e){state=blank()}let tab='home';function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und Backup exportieren.');return false}}function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}function sum(a){return a.reduce((s,x)=>s+Number(x||0),0)}function periodTx(){let c=cycle();return state.transactions.filter(t=>t.date>=c.start&&t.date<c.end)}function incomeTotal(){return sum(state.income.map(x=>x.amount))}function fixedTotal(){return sum(state.fixed.map(x=>monthlyAmount(x)))}function monthlyAmount(x){let n=Number(x.amount)||0;return x.frequency==='yearly'?n/12:x.frequency==='quarterly'?n/3:n}function spent(c){return sum(periodTx().filter(t=>t.type==='expense'&&(!c||t.category===c)).map(t=>t.amount))}function expenses(){return spent()}function inflows(){return sum(periodTx().filter(t=>t.type==='income').map(t=>t.amount))}function fixedDueDate(x,ref){let y=ref.getFullYear(),m=ref.getMonth(),d=Math.min(Number(x.dueDay)||1,new Date(y,m+1,0).getDate());return localDate(new Date(y,m,d,12))}
function dueDatesInCycle(x){const c=cycle(),start=parseDate(c.start),end=parseDate(c.end),dates=[];let month=new Date(start.getFullYear(),start.getMonth()-1,1,12);for(let i=0;i<5;i++){let y=month.getFullYear(),m=month.getMonth(),freq=x.frequency||'monthly',anchor=Number(x.anchorMonth)||1;let eligible=freq==='monthly'||(freq==='quarterly'&&((m+1-anchor+12)%3===0))||(freq==='yearly'&&m+1===anchor);if(eligible){let day=Math.min(Math.max(1,Number(x.dueDay)||1),new Date(y,m+1,0).getDate()),date=localDate(new Date(y,m,day,12));if(date>=c.start&&date<c.end)dates.push(date)}month=plusMonths(month,1)}return [...new Set(dates)]}
function linkedPayment(x,date){return state.transactions.some(t=>t.recurringId===x.id&&t.dueDate===date)}
function paidInCycle(x){return dueDatesInCycle(x).length>0&&dueDatesInCycle(x).every(d=>linkedPayment(x,d))}
function pendingItems(){return state.fixed.flatMap(x=>dueDatesInCycle(x).filter(d=>!linkedPayment(x,d)).map(d=>({item:x,date:d})))}
function pendingFixed(){return sum(pendingItems().map(z=>z.item.amount))}
function accountDelta(t,account){let a=Number(t.amount)||0;if(t.type==='transfer')return t.from===account?-a:t.to===account?a:0;return (t.account||'bank')===account?(t.type==='income'?a:-a):0}
function bankNow(){return Number(state.balance)+sum(state.transactions.filter(t=>t.date>=state.balanceAsOf&&t.date<=today()).map(t=>accountDelta(t,'bank')))}
function cashNow(){return Number(state.cash||0)+sum(state.transactions.filter(t=>t.date>=(state.cashAsOf||today())&&t.date<=today()).map(t=>accountDelta(t,'cash')))}
function balanceNow(){return bankNow()+cashNow()}
function available(){return balanceNow()-pendingFixed()-Number(state.buffer||0)}
function safeDaily(){return Math.max(0,available())/cycle().days}
function forecast(){return available()}
function recurringLeft(){return pendingFixed()}
function render(){const tabs=[['home','⌂','Übersicht'],['book','▤','Buchungen'],['budget','◉','Budgets'],['plan','▥','Planung']];document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'active':''}" onclick="tab='${t[0]}';render()"><span class="ico">${t[1]}</span>${t[2]}</button>`).join('');document.getElementById('fab').classList.toggle('hidden',tab==='plan');document.getElementById('content').innerHTML=({home:homeHTML,book:bookHTML,budget:budgetHTML,plan:planHTML}[tab])()}
function homeHTML(){let c=cycle(),v=available(),b=balanceNow(),tx=periodTx().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return `<div class="hero"><div class="muted">Nach offenen Fixkosten & Puffer</div><div class="big">${fmt(v)}</div><div class="herogrid"><div><div class="muted mini">Bank + Bargeld*</div><b>${fmt(b)}</b></div><div><div class="muted mini">Sicher pro Tag (Orientierung)</div><b>${fmt(safeDaily())}</b></div></div></div><div class="note" style="margin-top:12px">* Gesamtbestand basiert auf deinen eingegebenen Startsalden und späteren Buchungen. Nur erfasste Zahlungen verändern die Bestände. Bargeldabhebungen sind Umbuchungen, keine Ausgaben. Offene fällige Fixkosten werden vorsorglich reserviert. Fällige monatliche, vierteljährliche und jährliche Zahlungen im aktuellen Gehaltszyklus werden reserviert.</div><div class="grid" style="margin-top:14px"><div class="card"><div class="label">🏦 Bankkonto</div><div class="value">${fmt(bankNow())}</div></div><div class="card"><div class="label">👛 Portemonnaie</div><div class="value">${fmt(cashNow())}</div></div><div class="card"><div class="label">Geplante Einnahmen (nicht gebucht)</div><div class="value green">${fmt(incomeTotal())}</div></div><div class="card"><div class="label">Fixkosten / Monat (Plan)</div><div class="value">${fmt(fixedTotal())}</div></div><div class="card"><div class="label">Variable Ausgaben</div><div class="value red">${fmt(expenses())}</div></div><div class="card"><div class="label">Sicherheitspuffer</div><div class="value">${fmt(state.buffer)}</div></div></div><div class="section"><h2>Deine Budgets</h2><button class="rowbtn" onclick="tab='budget';render()">Alle ansehen</button></div>${state.budgets.filter(x=>x.limit>0).length?state.budgets.filter(x=>x.limit>0).slice(0,4).map(budgetCard).join(''):'<div class="card empty">Noch keine Kategorienbudgets. Tippe auf „Budgets“.</div>'}<div class="section"><h2>Letzte Buchungen</h2><button class="rowbtn" onclick="tab='book';render()">Alle</button></div><div class="card">${tx.length?tx.map(txRow).join(''):'<div class="empty">Noch keine Buchungen. Starte mit +</div>'}</div><div class="small">Finanzzeitraum: ${esc(c.start)} bis ${esc(c.end)} (exklusiv)</div>`}
function budgetCard(b){let u=spent(b.name),p=b.limit?Math.min(100,100*u/b.limit):0;return `<div class="card"><div class="line"><div class="itemleft"><span class="iconbox">${iconFor(b.name)}</span><div><div class="itemtitle">${esc(b.name)}</div><div class="small">${fmt(u)} von ${fmt(b.limit)}</div></div></div><strong class="${u>b.limit?'red':'green'}">${fmt(b.limit-u)}</strong></div><div class="progress"><div class="fill" style="width:${p}%;background:${u>b.limit?'#e35d65':p>=80?'#e7a446':'#4387ed'}"></div></div></div>`}function txRow(t){return `<div class="item line"><div class="itemleft"><div class="iconbox">${t.type==='transfer'?'↔️':t.type==='income'?'💰':iconFor(t.category)}</div><div><div class="itemtitle">${esc(t.title)}</div><div class="small">${esc(t.date)} · ${esc(t.type==='transfer'?'Umbuchung · '+(t.from==='bank'?'Bank → Bar':'Bar → Bank'):t.type==='income'?'Einnahme · '+(t.account==='cash'?'Bar':'Karte/Bank'):t.category+' · '+(t.account==='cash'?'Bar':'Karte/Bank'))}</div></div></div><div class="right"><strong class="${t.type==='income'?'green':t.type==='transfer'?'':'red'}">${t.type==='transfer'?'↔ ':t.type==='income'?'+':'−'}${fmt(t.amount)}</strong><div><button class="rowbtn mini" onclick="editTransaction('${t.id}')">Bearbeiten</button></div></div></div>`}function bookHTML(){let tx=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="heading">Buchungen</div><div class="card"><div class="line"><span class="label">Erfasste Buchungen</span><strong>${tx.length}</strong></div></div><div class="card">${tx.length?tx.map(txRow).join(''):'<div class="empty">Noch keine Buchungen vorhanden</div>'}</div>`}function budgetHTML(){return `<div class="heading">Budgets</div><div class="note">Setze für jede Kategorie einen Monatsrahmen. Kategorielimits dienen zur Orientierung. Nur echte Buchungen ändern den Kontostand. Reservierte Fixkosten werden separat berücksichtigt.</div><div class="section"><h2>Kategorien</h2><button class="secondary" onclick="editBudgets()">Budgets bearbeiten</button></div>${state.budgets.map(b=>b.limit>0?budgetCard(b):`<div class="card line"><div>${iconFor(b.name)} ${esc(b.name)}</div><span class="small">Kein Limit</span></div>`).join('')}<div class="card"><div class="line"><b>Summe deiner Limits</b><b>${fmt(sum(state.budgets.map(b=>b.limit)))}</b></div><div class="small">Aktuell nach offenen Fixkosten und Puffer: ${fmt(available())}</div></div>`}function planHTML(){let c=cycle();return `<div class="heading">Finanzplanung</div><div class="card"><div class="label">Nächster Gehaltstermin (Wochenenden, ohne Feiertage)</div><div class="value blue">${esc(c.end)}</div><div class="small">Noch ungefähr ${c.days} Tage</div></div><div class="grid"><div class="card"><div class="label">Nach Reserven</div><div class="value ${available()<0?'red':''}">${fmt(available())}</div></div><div class="card"><div class="label">Bank + Bargeld*</div><div class="value ${balanceNow()<0?'red':''}">${fmt(balanceNow())}</div></div></div><div class="card"><b>Prognose mit Vorsicht</b><p class="small">Konservative Momentaufnahme: aktueller erfasster Kontostand abzüglich noch nicht als bezahlt markierter monatlicher Fixkosten und Puffer. Geplantes Gehalt wird NICHT als verfügbares Geld gerechnet.</p><div class="note">Prognose ist keine Bankabfrage. Nicht erfasste Kartenzahlungen und unvorhergesehene Ausgaben können den Wert verändern. Künftige Fälligkeiten außerhalb dieses Gehaltszyklus sind noch nicht reserviert.</div></div><div class="section"><h2>Deine Grundlagen</h2></div><div class="card"><div class="line"><b>Einnahmen</b><button class="rowbtn" onclick="editRecurring('income')">Bearbeiten</button></div>${state.income.length?state.income.map(x=>`<div class="item line"><span>${esc(x.name)}</span><strong>${fmt(x.amount)}</strong></div>`).join(''):'<div class="empty">Keine Einnahmen hinterlegt</div>'}</div><div class="card"><div class="line"><b>Fixkosten</b><button class="rowbtn" onclick="editRecurring('fixed')">Bearbeiten</button></div>${state.fixed.length?state.fixed.map(x=>`<div class="item line"><div>${esc(x.name)}<div class="small">${x.frequency==='yearly'?'Jährlich':x.frequency==='quarterly'?'Vierteljährlich':'Monatlich'}</div></div><div class="right"><strong>${fmt(monthlyAmount(x))}/Monat</strong>${dueDatesInCycle(x).length?`<div><button class="rowbtn mini" onclick="markPaid('${x.id}')" ${paidInCycle(x)?'disabled':''}>${paidInCycle(x)?'✓ Bezahlt':'Fälligkeit buchen'}</button></div>`:''}</div></div>`).join(''):'<div class="empty">Keine Fixkosten hinterlegt</div>'}</div><button class="secondary full" onclick="openSettings()">⚙️ Kontostand, Puffer und Backup</button>`}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden')}function openTransaction(id){let t=state.transactions.find(x=>x.id===id)||{type:'expense',account:'bank',from:'bank',to:'cash',date:today(),title:'',amount:'',category:'Lebensmittel'};modal(`<h2>${id?'Buchung bearbeiten':'Neue Buchung'}</h2><form id="txform"><label>Art</label><select name="type" id="ttype" onchange="updateTxFields()"><option value="expense" ${t.type==='expense'?'selected':''}>Ausgabe</option><option value="income" ${t.type==='income'?'selected':''}>Einnahme</option><option value="transfer" ${t.type==='transfer'?'selected':''}>Umbuchung / Bargeld abheben</option></select><label>Beschreibung</label><input name="title" required maxlength="100" placeholder="z. B. Edeka" value="${esc(t.title)}"><div class="formgrid"><div><label>Betrag in €</label><input name="amount" required type="number" min="0.01" step="0.01" inputmode="decimal" value="${esc(t.amount)}"></div><div><label>Datum</label><input name="date" required type="date" value="${esc(t.date)}"></div></div><div id="accountwrap"><label>Bezahlt / erhalten über</label><select name="account"><option value="bank" ${t.account!=='cash'?'selected':''}>💳 Karte / Bankkonto</option><option value="cash" ${t.account==='cash'?'selected':''}>👛 Bargeld</option></select></div><div id="transferwrap" class="hidden"><label>Geld verschieben</label><select name="direction"><option value="bank-cash" ${t.from!=='cash'?'selected':''}>🏧 Bank → Portemonnaie (Abhebung)</option><option value="cash-bank" ${t.from==='cash'?'selected':''}>🏦 Portemonnaie → Bank (Einzahlung)</option></select></div><div id="catwrap" class="${t.type!=='expense'?'hidden':''}"><label>Kategorie</label><select name="category">${state.budgets.map(c=>`<option ${c.name===t.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="btnrow" style="margin-top:20px"><button class="primary" type="submit">Speichern</button><button type="button" class="secondary" onclick="closeModal()">Abbrechen</button>${id?`<button type="button" class="danger" onclick="deleteTransaction('${id}')">Löschen</button>`:''}</div></form>`);updateTxFields();document.getElementById('txform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return alert('Bitte gültigen Betrag eingeben.');let typ=f.get('type'),dir=String(f.get('direction'));let v={id:id||uid(),type:typ,title:String(f.get('title')).trim(),amount:Math.round(amount*100)/100,date:f.get('date'),category:typ==='expense'?f.get('category'):'',account:f.get('account'),...(typ==='transfer'?{from:dir.split('-')[0],to:dir.split('-')[1]}:{})};if(id)state.transactions=state.transactions.map(x=>x.id===id?{...v,...(x.recurringId&&typ==='expense'?{recurringId:x.recurringId,dueDate:x.dueDate}:{})}:x);else state.transactions.push(v);save();closeModal();render()}}function updateTxFields(){let typ=document.getElementById('ttype').value;document.getElementById('catwrap').classList.toggle('hidden',typ!=='expense');document.getElementById('accountwrap').classList.toggle('hidden',typ==='transfer');document.getElementById('transferwrap').classList.toggle('hidden',typ!=='transfer')}function editTransaction(id){openTransaction(id)}function deleteTransaction(id){if(confirm('Buchung wirklich löschen?')){state.transactions=state.transactions.filter(x=>x.id!==id);save();closeModal();render()}}
function markPaid(id,due){let x=state.fixed.find(z=>z.id===id);if(!x)return;let dates=dueDatesInCycle(x).filter(d=>!linkedPayment(x,d));let dueDate=due||dates[0];if(!dueDate)return alert('Keine offene Fälligkeit in diesem Gehaltszyklus.');let d=prompt('Tatsächliches Zahlungsdatum (JJJJ-MM-TT)',today());if(!d)return;if(!validDate(d)||d>today())return alert('Bitte gültiges Zahlungsdatum bis heute eingeben.');let match=state.transactions.find(t=>t.type==='expense'&&!t.recurringId&&t.date===d&&Math.abs(t.amount-x.amount)<.005&&t.title.trim().toLowerCase()===x.name.trim().toLowerCase());if(match){if(!confirm('Passende Buchung gefunden. Diese als Fixkostenzahlung zuordnen, statt doppelt zu buchen?'))return;match.recurringId=id;match.dueDate=dueDate;}else{if(!confirm('Zahlung '+fmt(x.amount)+' für '+x.name+' als neue Ausgabe buchen? Wenn sie schon unter anderem Namen gebucht wurde, bitte zuerst die bestehende Buchung bearbeiten.'))return;state.transactions.push({id:uid(),recurringId:id,dueDate,type:'expense',title:x.name,amount:Number(x.amount),date:d,category:'Fixkosten',account:'bank'})}save();render()}
function editRecurring(type){let arr=state[type],fixed=type==='fixed';modal(`<h2>${fixed?'Fixkosten':'Einnahmen'}</h2><div id="reclist">${arr.map(x=>`<div class="item line"><span>${esc(x.name)} – ${fmt(x.amount)}</span><button class="danger" onclick="removeRecurring('${type}','${x.id}')">Entfernen</button></div>`).join('')}</div><form id="recform"><label>Bezeichnung</label><input name="name" required maxlength="100" placeholder="${fixed?'z. B. Miete':'z. B. Gehalt'}"><label>Betrag in €</label><input name="amount" required type="number" min="0.01" step="0.01" inputmode="decimal">${fixed?'<div class="formgrid"><div><label>Intervall</label><select name="frequency"><option value="monthly">Monatlich</option><option value="quarterly">Vierteljährlich</option><option value="yearly">Jährlich</option></select></div><div><label>Fälligkeit (Tag)</label><input name="dueDay" type="number" min="1" max="31" value="1"><label>Startmonat für Jahres-/Quartalszahlungen (1–12)</label><input name="anchorMonth" type="number" min="1" max="12" value="1"></div></div>':''}<div class="btnrow" style="margin-top:20px"><button class="primary">Hinzufügen</button><button type="button" class="secondary" onclick="closeModal()">Fertig</button></div></form><p class="note">Planwerte sind keine Buchungen. Monatliche Fixkosten kannst du in Planung als bezahlt buchen. Bei manuellen Zahlungen bitte die passende Buchung zuordnen, um Doppelzählungen zu vermeiden.</p>`);document.getElementById('recform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a=Number(f.get('amount'));if(!Number.isFinite(a)||a<=0)return;arr.push({id:uid(),name:String(f.get('name')).trim(),amount:a,...(fixed?{frequency:f.get('frequency'),dueDay:Number(f.get('dueDay')),anchorMonth:Number(f.get('anchorMonth'))||1}: {})});save();editRecurring(type);render()}}function removeRecurring(type,id){state[type]=state[type].filter(x=>x.id!==id);save();editRecurring(type);render()}
function editBudgets(){modal(`<h2>Kategorienbudgets</h2><form id="budform">${state.budgets.map((x,i)=>`<label>${iconFor(x.name)} ${esc(x.name)}</label><input type="number" inputmode="decimal" step="0.01" min="0" name="b${i}" value="${x.limit}" required>`).join('')}<div class="btnrow" style="margin-top:20px"><button class="primary">Budgets speichern</button><button type="button" class="secondary" onclick="closeModal()">Abbrechen</button></div></form>`);document.getElementById('budform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.budgets.forEach((x,i)=>x.limit=Number(f.get('b'+i))||0);save();closeModal();render()}}
function openSettings(){modal(`<h2>Einstellungen & Datensicherung</h2><form id="settingsform"><label>Abgeglichener Kontostand in € (Minus erlaubt)</label><input name="balance" required type="number" step="0.01" inputmode="decimal" value="${state.balance}"><label>🏦 Bankkontostand gilt für Datum</label><input name="balanceAsOf" required type="date" value="${esc(state.balanceAsOf)}"><label>👛 Bargeld im Portemonnaie in €</label><input name="cash" required type="number" step="0.01" inputmode="decimal" value="${state.cash||0}"><label>Bargeldbestand gilt für Datum</label><input name="cashAsOf" required type="date" value="${esc(state.cashAsOf||today())}"><label>Sicherheitspuffer pro Finanzmonat in €</label><input name="buffer" required type="number" min="0" step="0.01" value="${state.buffer}"><div class="btnrow" style="margin-top:17px"><button class="primary">Einstellungen speichern</button><button type="button" class="secondary" onclick="closeModal()">Schließen</button></div></form><p class="note">Kontostand ist der Anfangsbestand VOR den Buchungen am gewählten Abgleichdatum. Buchungen ab diesem Datum werden eingerechnet. Für einen aktuellen Stand nach heutigen Buchungen wähle morgen als Stichtag (oder gleiche alte Buchungen ab). Beim erneuten Abgleich mit dem echten Bankkonto setze das Datum auf heute. Schon gebuchte Fixkosten bitte nicht noch einmal als bezahlt erfassen.</p><div class="section"><h2>Backup</h2></div><div class="btnrow"><button class="secondary" onclick="exportData()">⬇️ Backup herunterladen</button><button class="secondary" onclick="document.getElementById('importfile').click()">⬆️ Backup importieren</button></div><input type="file" id="importfile" accept="application/json,.json" class="hidden" onchange="importData(this)"><p class="small">Daten liegen lokal in diesem Browser. Safari-Daten löschen, privater Modus oder Gerätewechsel kann sie entfernen. Exportiere regelmäßig ein Backup. Ein Backup enthält sensible Finanzdaten – sicher aufbewahren.</p><div class="section"><h2>Zurücksetzen</h2></div><button class="danger" onclick="resetAll()">Alle Daten löschen</button>`);document.getElementById('settingsform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.balance=Number(f.get('balance'));state.balanceAsOf=f.get('balanceAsOf');state.cash=Number(f.get('cash'));state.cashAsOf=f.get('cashAsOf');state.buffer=Number(f.get('buffer'));save();closeModal();render()}}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;let d=parseDate(s);return localDate(d)===s}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MONETA-Backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(el){let f=el.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(![2,3,4].includes(d.version)||!Array.isArray(d.transactions)||!Array.isArray(d.budgets)||!Array.isArray(d.income)||!Array.isArray(d.fixed)||typeof d.balance!=='number'||typeof d.balanceAsOf!=='string')throw Error('Ungültiges Backupformat');if(d.transactions.some(t=>!t||!['expense','income','transfer'].includes(t.type)||!Number.isFinite(Number(t.amount))||Number(t.amount)<=0||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!['bank','cash'].includes(t.account||'bank')&&t.type!=='transfer'||(t.type==='transfer'&&(!['bank','cash'].includes(t.from)||!['bank','cash'].includes(t.to)||t.from===t.to)))||d.fixed.some(x=>!x||!Number.isFinite(Number(x.amount))||Number(x.amount)<0)||d.budgets.some(x=>!x||!Number.isFinite(Number(x.limit))||Number(x.limit)<0))throw Error('Ungültige Buchungsdaten');if(!confirm('Aktuelle Daten durch dieses Backup ersetzen?'))return;let previous=state;state=d;state.version=4;state.cash=Number(state.cash)||0;state.cashAsOf=state.cashAsOf||today();if(!save()){state=previous;return}closeModal();render();alert('Backup importiert.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}}function resetAll(){if(confirm('Wirklich ALLE Finanzdaten löschen? Das lässt sich ohne Backup nicht rückgängig machen.')&&confirm('Letzte Bestätigung: Daten unwiderruflich löschen?')){state=blank();save();closeModal();render()}}render();
</script></body></html>
