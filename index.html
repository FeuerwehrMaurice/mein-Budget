<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Mein Budget</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef3ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:550px;margin:auto;padding:22px 18px 100px}h1{font-size:27px;margin:0 0 5px}h2{font-size:18px;margin:0 0 15px}.muted{color:#9aa9c2;font-size:13px}.card{background:#172235;border:1px solid #293a55;border-radius:22px;padding:19px;margin:16px 0}.hero{background:linear-gradient(140deg,#235b68,#183351 65%,#202b50)}.big{font-size:39px;font-weight:800;letter-spacing:-1px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.mini{padding:15px;margin:0}.number{font-size:22px;font-weight:750;margin-top:7px}.bar{height:9px;border-radius:10px;background:#344157;overflow:hidden;margin:12px 0 7px}.fill{height:100%;background:#56d6bc;border-radius:10px}.item{padding:13px 0;border-bottom:1px solid #293a55;display:flex;align-items:center;justify-content:space-between;gap:8px}.item:last-child{border:0}.item small{display:block;color:#a2afc3;margin-top:3px}.pill{border-radius:20px;padding:5px 9px;background:#273a50;font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111b2b;border-top:1px solid #2a3c53;display:flex;justify-content:center;padding:10px 8px calc(12px + env(safe-area-inset-bottom));gap:8px;z-index:4}.tabs button{flex:1;max-width:135px;background:none;color:#a4b1c7;font-size:12px;padding:9px 2px}.tabs button.active{color:#69e4ce}button{border:0;border-radius:13px;background:#5ee0c7;color:#09262c;font-weight:750;padding:12px 15px;cursor:pointer;font-size:15px}button.secondary{background:#293950;color:#f0f4fa}button.danger{background:#51303d;color:#ffb6c4}button:disabled{opacity:.45}input,select{width:100%;border:1px solid #3b4b62;border-radius:12px;background:#0e192a;color:#fff;padding:13px;font-size:16px;margin:6px 0 14px}label{font-size:13px;color:#b9c7d9}input[type=file]{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.hidden{display:none!important}.fab{position:fixed;bottom:79px;right:max(22px,calc((100vw - 550px)/2 + 22px));z-index:3;border-radius:50%;width:60px;height:60px;font-size:32px;box-shadow:0 10px 30px #0009}.notice{color:#f8d39c;font-size:12px;line-height:1.5}.positive{color:#6ce5cb}.negative{color:#ff9ca8}dialog{border:1px solid #35465d;border-radius:24px;background:#172235;color:white;width:calc(100% - 24px);max-width:510px;max-height:88vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}img.preview{max-width:100%;max-height:220px;border-radius:12px;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;letter-spacing:1.5px;color:#72e6d2;font-weight:700} .sub{font-size:13px;line-height:1.5;color:#aab8ca}</style></head><body><main><div class="top"><div><div class="tag">DEIN GELD. DEIN PLAN.</div><h1>Mein Budget</h1><div id="period" class="muted"></div></div><span style="font-size:32px">💸</span></div><section id="dashboard"></section><section id="transactions" class="hidden"></section><section id="planning" class="hidden"></section><section id="settings" class="hidden"></section></main><button class="fab" onclick="openExpense()" aria-label="Ausgabe hinzufügen">+</button><nav class="tabs"><button data-tab="dashboard" class="active" onclick="tab('dashboard')">⌂<br>Übersicht</button><button data-tab="transactions" onclick="tab('transactions')">⇄<br>Buchungen</button><button data-tab="planning" onclick="tab('planning')">▥<br>Budgets</button><button data-tab="settings" onclick="tab('settings')">⚙<br>Einstellungen</button></nav><dialog id="modal"><div class="top"><h2 id="modalTitle">Neue Ausgabe</h2><button class="secondary" onclick="modal.close()">✕</button></div><div id="modalBody"></div></dialog><script>
const KEY='meinbudget_v1';const cats=['Lebensmittel','Freizeit','Shopping','Mobilität','Restaurants','Gesundheit','Sonstiges'];const icons={'Lebensmittel':'🛒','Freizeit':'🎉','Shopping':'🛍️','Mobilität':'🚗','Restaurants':'🍽️','Gesundheit':'💊','Sonstiges':'📦'};let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{income:0,buffer:0,budgets:{Lebensmittel:250,Freizeit:150,Shopping:100,Mobilität:100,Restaurants:100,Gesundheit:50,Sonstiges:50},fixed:[],transactions:[],openingBalance:0};const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function lastBusinessDay(y,m){let d=new Date(y,m+1,0);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d}function period(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),start=lastBusinessDay(y,m-1);if(now<start)start=lastBusinessDay(y,m-2);let end=lastBusinessDay(start.getFullYear(),start.getMonth()+1);return {start,end,days:Math.max(1,Math.ceil((end-now)/86400000)),label:start.toLocaleDateString('de-DE')+' – '+new Date(end.getTime()-86400000).toLocaleDateString('de-DE')}}function inPeriod(t,p){let d=new Date(t.date+'T12:00:00');return d>=p.start&&d<p.end}function totals(){let p=period(),tx=db.transactions.filter(t=>inPeriod(t,p)),spent=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),extra=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),fixed=db.fixed.reduce((a,f)=>a+f.amount,0),available=db.income+extra+db.openingBalance-fixed-db.buffer-spent;return {p,tx,spent,extra,fixed,available}}function render(){let x=totals();document.getElementById('period').textContent='Budgetzeitraum: '+x.p.label;let spentBy=c=>x.tx.filter(t=>t.type==='expense'&&t.category===c).reduce((a,t)=>a+t.amount,0);document.getElementById('dashboard').innerHTML=`<div class="card hero"><div class="muted">Noch frei verfügbar · nach Fixkosten & Puffer</div><div class="big ${x.available<0?'negative':''}">${eur(x.available)}</div><div class="sub">${x.p.days} Tage bis zum nächsten Gehaltszyklus · rechnerisch ${eur(Math.max(0,x.available)/x.p.days)} pro Tag</div></div><div class="grid"><div class="card mini"><div class="muted">Monatseinnahmen</div><div class="number">${eur(db.income+x.extra)}</div></div><div class="card mini"><div class="muted">Fixkosten</div><div class="number">${eur(x.fixed)}</div></div><div class="card mini"><div class="muted">Ausgaben erfasst</div><div class="number">${eur(x.spent)}</div></div><div class="card mini"><div class="muted">Sicherheitspuffer</div><div class="number">${eur(db.buffer)}</div></div></div><div class="card"><h2>Deine Kategorien</h2>${cats.map(c=>{let v=spentBy(c),b=db.budgets[c]||0;return `<div class="item"><div style="flex:1"><div>${icons[c]} ${c}</div><div class="bar"><div class="fill" style="width:${b?Math.min(100,v/b*100):0}%;background:${v>b?'#ff9ca8':'#56d6bc'}"></div></div><small>${eur(v)} von ${eur(b)} ausgegeben</small></div><strong class="${v>b?'negative':'positive'}">${eur(b-v)}</strong></div>`}).join('')}</div><p class="notice">Die Werte basieren auf deinen Einträgen, nicht auf deinem echten Kontostand. Wiederkehrende Fixkosten werden pro Budgetzeitraum einmal berücksichtigt.</p>`;document.getElementById('transactions').innerHTML=`<div class="card"><h2>Buchungen im aktuellen Zeitraum</h2>${x.tx.length?[...x.tx].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item"><div><strong>${t.type==='income'?'💰':icons[t.category]||'📦'} ${esc(t.title)}</strong><small>${esc(t.category||'Einnahme')} · ${esc(t.date)}</small></div><div style="text-align:right"><strong class="${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${eur(t.amount)}</strong><div><button class="secondary" style="font-size:11px;padding:5px 8px;margin-top:5px" onclick="delTx('${t.id}')">Löschen</button></div></div></div>`).join(''):'<p class="muted">Noch keine Buchungen. Starte mit dem Plus-Button.</p>'}</div><button class="secondary" onclick="openIncome()">+ Zusätzliche Einnahme</button>`;document.getElementById('planning').innerHTML=`<div class="card"><div class="top"><h2>Monatliche Kategorien</h2><button class="secondary" onclick="editBudgets()">Bearbeiten</button></div>${cats.map(c=>`<div class="item"><span>${icons[c]} ${c}</span><strong>${eur(db.budgets[c])}</strong></div>`).join('')}</div><div class="card"><div class="top"><h2>Fixkosten</h2><button class="secondary" onclick="addFixed()">+ Hinzufügen</button></div>${db.fixed.length?db.fixed.map(f=>`<div class="item"><span>${esc(f.title)}</span><span>${eur(f.amount)} <button class="secondary" style="padding:5px 8px" onclick="delFixed('${f.id}')">✕</button></span></div>`).join(''):'<p class="muted">Miete, Abos, Versicherungen usw. selbst eintragen.</p>'}<div class="item"><strong>Gesamt</strong><strong>${eur(x.fixed)}</strong></div></div>`;document.getElementById('settings').innerHTML=`<div class="card"><h2>Deine Grundlagen</h2><label>Regelmäßiges Nettogehalt (€)</label><input id="income" type="number" min="0" step="0.01" value="${db.income}"><label>Startguthaben / Übertrag (€)</label><input id="opening" type="number" step="0.01" value="${db.openingBalance}"><label>Monatlicher Sicherheitspuffer (€)</label><input id="buffer" type="number" min="0" step="0.01" value="${db.buffer}"><button onclick="saveSettings()">Einstellungen speichern</button><p class="sub">Gehaltstermin: letzter Bankarbeitstag des Vormonats (Wochenenden berücksichtigt; Feiertage derzeit nicht). Das Startguthaben ist ein fester Übertrag und wird in jedem Zeitraum angesetzt, bis du es änderst.</p></div><div class="card"><h2>Datensicherung</h2><p class="sub">Deine Daten liegen lokal in diesem Browser. Bitte regelmäßig sichern.</p><div class="actions"><button onclick="exportData()">Backup exportieren</button><button class="secondary" onclick="document.getElementById('importFile').click()">Backup laden</button></div><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="card"><h2>Bon-Fotos</h2><p class="sub">Du kannst beim Erfassen ein Bon-Foto auswählen und den Betrag daraus manuell übernehmen. Automatisches Auslesen ist noch nicht enthalten. Das Foto wird nicht gespeichert.</p></div>`}
function tab(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));render()}function show(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;modal.showModal()}function openExpense(){show('Neue Ausgabe',`<form onsubmit="addTx(event,'expense')"><label>Geschäft / Beschreibung</label><input name="title" id="merchant" placeholder="z. B. Edeka" required oninput="guessCategory(this.value)"><label>Betrag (€)</label><input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="10,00" required><label>Kategorie</label><select name="category" id="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select><label>Datum</label><input name="date" type="date" value="${new Date().toLocaleDateString('sv-SE')}" required><label>Bon fotografieren (optional, ohne Texterkennung)</label><input type="file" accept="image/*" capture="environment" onchange="previewBon(event)"><div id="bonPreview"></div><button style="width:100%">Ausgabe speichern</button></form>`)}function previewBon(e){let f=e.target.files[0],el=document.getElementById('bonPreview');if(!f)return;let url=URL.createObjectURL(f);el.innerHTML='<img class="preview" src="'+url+'"><p class="muted">Bitte Betrag und Kategorie selbst prüfen und eingeben.</p>'}function guessCategory(v){let s=v.toLowerCase(),c=/edeka|rewe|lidl|aldi|kaufland|netto|penny/.test(s)?'Lebensmittel':/dm|rossmann|apotheke/.test(s)?'Gesundheit':/restaurant|cafe|café|mcdonald|burger/.test(s)?'Restaurants':/tank|aral|shell|bahn|bvg/.test(s)?'Mobilität':null;if(c)document.getElementById('category').value=c}function openIncome(){show('Zusätzliche Einnahme',`<form onsubmit="addTx(event,'income')"><label>Beschreibung</label><input name="title" required placeholder="z. B. Rückerstattung"><label>Betrag (€)</label><input name="amount" type="number" step="0.01" min="0.01" required><label>Datum</label><input name="date" type="date" value="${new Date().toLocaleDateString('sv-SE')}"><button>Speichern</button></form>`)}function addTx(e,type){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return;db.transactions.push({id:crypto.randomUUID(),title:String(f.get('title')).trim(),amount,date:String(f.get('date')),category:type==='expense'?String(f.get('category')):'Einnahme',type});modal.close();save()}function delTx(id){if(confirm('Buchung wirklich löschen?')){db.transactions=db.transactions.filter(t=>t.id!==id);save()}}function editBudgets(){show('Budgets bearbeiten',`<form onsubmit="saveBudgets(event)">${cats.map((c,i)=>`<label>${icons[c]} ${c} (€)</label><input type="number" name="c${i}" min="0" step="0.01" value="${db.budgets[c]||0}" required>`).join('')}<button>Budgets speichern</button></form>`)}function saveBudgets(e){e.preventDefault();let f=new FormData(e.target);cats.forEach((c,i)=>db.budgets[c]=Math.max(0,Number(f.get('c'+i))||0));modal.close();save()}function addFixed(){show('Fixkosten hinzufügen',`<form onsubmit="saveFixed(event)"><label>Bezeichnung</label><input name="title" required placeholder="z. B. Miete"><label>Monatlicher Betrag (€)</label><input name="amount" type="number" min="0.01" step="0.01" required><button>Fixkosten speichern</button></form>`)}function saveFixed(e){e.preventDefault();let f=new FormData(e.target);db.fixed.push({id:crypto.randomUUID(),title:String(f.get('title')).trim(),amount:Number(f.get('amount'))});modal.close();save()}function delFixed(id){if(confirm('Fixkostenposition löschen?')){db.fixed=db.fixed.filter(f=>f.id!==id);save()}}function saveSettings(){db.income=Math.max(0,Number(document.getElementById('income').value)||0);db.buffer=Math.max(0,Number(document.getElementById('buffer').value)||0);db.openingBalance=Number(document.getElementById('opening').value)||0;save();alert('Gespeichert')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mein-budget-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o||!Array.isArray(o.transactions)||!Array.isArray(o.fixed)||!o.budgets||typeof o.income!=='number')throw Error();if(confirm('Alle aktuellen Daten durch das Backup ersetzen?')){db=o;save()}}catch{alert('Ungültige Backup-Datei')}e.target.value=''}render();if(!localStorage.getItem(KEY))tab('settings');
</script></body></html>
